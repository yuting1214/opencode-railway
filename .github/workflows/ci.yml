name: ci

# Guards the two things that historically broke deploys:
#   1. the pinned OpenCode version not being what the image actually runs
#   2. /site.webmanifest — the Railway healthcheck path — not returning 200
#      WITHOUT auth. If an upstream release ever protects it, every deploy fails.
on:
  push:
    branches: [main]
    paths: ['opencode/**', 'opencode-v2/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['opencode/**', 'opencode-v2/**', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t opencode-ci ./opencode

      - name: Image must run exactly the pinned version
        run: |
          pin=$(grep -oP '^ARG OPENCODE_VERSION=\K.*' opencode/Dockerfile)
          got=$(docker run --rm --entrypoint opencode opencode-ci --version | tr -d '\r\n')
          echo "pinned=$pin  running=$got"
          if [ "$pin" != "$got" ]; then
            echo "::error::Dockerfile pins $pin but the image runs $got"
            exit 1
          fi

      - name: Start container
        run: |
          mkdir -p /tmp/ws
          docker run -d --name oc \
            -v /tmp/ws:/workspace \
            -e OPENCODE_SERVER_USERNAME=opencode \
            -e OPENCODE_SERVER_PASSWORD=ci-test-password \
            -p 8080:8080 opencode-ci
          # opencode web needs a moment; poll rather than sleep a fixed amount.
          for i in $(seq 1 60); do
            if [ "$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/site.webmanifest)" = "200" ]; then
              echo "up after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "::error::service never became reachable"
          exit 1

      - name: Healthcheck path must be 200 WITHOUT credentials
        run: |
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/site.webmanifest)
          echo "/site.webmanifest -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::healthcheckPath in railway.json would fail every deploy"
            exit 1
          fi

      - name: Everything else must stay behind basic auth
        run: |
          anon=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/)
          auth=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -u opencode:ci-test-password http://localhost:8080/)
          echo "/ anon=$anon auth=$auth"
          [ "$anon" = "401" ] || { echo "::error::public URL is not password protected"; exit 1; }
          [ "$auth" = "200" ] || { echo "::error::correct credentials rejected"; exit 1; }

      - name: Volume state was created on first boot
        run: |
          docker exec oc test -f /workspace/.ssh/id_ed25519
          docker exec oc test -L /root/.local/share/opencode
          docker exec oc test -L /root/.config/opencode

      - name: Container logs
        if: always()
        run: docker logs oc || true

  # OpenCode 2 template (opencode-v2/). Different server, different guards:
  # the web UI shell is public by design and `/` is the healthcheck, while the
  # API must refuse anonymous callers.
  v2-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t opencode-v2-ci ./opencode-v2

      - name: Image must run exactly the pinned version
        run: |
          pin=$(grep -oP '^ARG OPENCODE_VERSION=\K.*' opencode-v2/Dockerfile)
          got=$(docker run --rm --entrypoint opencode opencode-v2-ci --version | tr -d '\r\n')
          echo "pinned=$pin  running=$got"
          if [ "$got" != "opencode v$pin" ]; then
            echo "::error::Dockerfile pins $pin but the image runs $got"
            exit 1
          fi

      - name: Start container
        run: |
          mkdir -p /tmp/ws2
          docker run -d --name oc2 \
            -v /tmp/ws2:/workspace \
            -e OPENCODE_PASSWORD=ci-test-password \
            -p 8080:8080 opencode-v2-ci
          # The server answers `/` before the API is ready; wait for the API.
          for i in $(seq 1 60); do
            if [ "$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -u opencode:ci-test-password http://localhost:8080/api/session)" = "200" ]; then
              echo "up after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "::error::service never became reachable"
          exit 1

      - name: Healthcheck path must be 200 WITHOUT credentials
        run: |
          code=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/)
          echo "/ -> $code"
          [ "$code" = "200" ] || { echo "::error::healthcheckPath in railway.json would fail every deploy"; exit 1; }

      - name: API must refuse anonymous and wrong-password callers
        run: |
          anon=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' http://localhost:8080/api/session)
          bad=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -u opencode:wrong http://localhost:8080/api/session)
          good=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -u opencode:ci-test-password http://localhost:8080/api/session)
          echo "/api/session anon=$anon wrong=$bad right=$good"
          [ "$anon" = "401" ] || { echo "::error::API is not password protected"; exit 1; }
          [ "$bad" = "401" ]  || { echo "::error::wrong password accepted"; exit 1; }
          [ "$good" = "200" ] || { echo "::error::correct credentials rejected"; exit 1; }

      - name: The CLI attaches to the same server (shared sessions)
        run: |
          status=$(docker exec oc2 bash -lc 'opencode service status' | tr -d '\r')
          echo "service status: $status"
          [ "$status" = "http://0.0.0.0:8080" ] || { echo "::error::TUI would start a separate server"; exit 1; }

      - name: First boot seeds the "Start here" session in /workspace/repos
        run: |
          # Without it, a fresh browser has no project and New session does nothing.
          for i in $(seq 1 30); do
            dir=$(curl -s --max-time 10 -u opencode:ci-test-password 'http://localhost:8080/api/session?limit=50' \
              | jq -r '.data[] | select(.title | startswith("Start here")) | .location.directory')
            [ -n "$dir" ] && break
            sleep 2
          done
          echo "Start here session directory: ${dir:-<none>}"
          [ "$dir" = "/workspace/repos" ] || { echo "::error::Start here session missing or not in /workspace/repos"; exit 1; }
          docker exec oc2 test -f /workspace/.opencode-start-session

      - name: Volume state was created on first boot
        run: |
          docker exec oc2 test -f /workspace/.ssh/id_ed25519
          docker exec oc2 test -L /root/.local/share/opencode
          docker exec oc2 test -L /root/.config/opencode
          docker exec oc2 test -f /workspace/opencode/config/service.json

      - name: Container logs
        if: always()
        run: docker logs oc2 || true
